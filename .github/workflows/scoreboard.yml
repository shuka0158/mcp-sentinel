name: Rebuild scoreboard

on:
  schedule:
    - cron: "0 6 * * 1"  # every Monday 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: python scoreboard/build_scoreboard.py
      - name: Commit if changed
        run: |
          git config user.name "mcp-sentinel-bot"
          git config user.email "actions@users.noreply.github.com"
          git diff --quiet SCOREBOARD.md || (git add SCOREBOARD.md && git commit -m "chore: weekly scoreboard rebuild" && git push)
