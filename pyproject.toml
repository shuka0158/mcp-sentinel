[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcpsentinel"
version = "0.1.0"
description = "Security scanner for MCP servers — know what a server can do before you install it."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "shuka0158" }]
keywords = ["mcp", "model-context-protocol", "security", "static-analysis", "ai-agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "click>=8.1",
    "rich>=13.7",
]

[project.optional-dependencies]
dynamic = ["mcp>=1.2"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.6", "mcp>=1.2"]

[project.scripts]
mcp-sentinel = "mcp_sentinel.cli:main"

[project.urls]
Homepage = "https://github.com/shuka0158/mcp-sentinel"
Issues = "https://github.com/shuka0158/mcp-sentinel/issues"

[tool.setuptools.packages.find]
include = ["mcp_sentinel*"]

[tool.ruff]
line-length = 100
target-version = "py310"
# EXE002 is disabled project-wide: the repo can live on filesystems
# (e.g. exFAT/NTFS-via-FUSE) that stamp every file world-executable
# regardless of git's tracked mode, which would otherwise false-positive
# on every plain .py file.
lint.ignore = ["EXE002"]

[tool.ruff.lint.per-file-ignores]
# Fixtures deliberately model sloppy/vulnerable real-world code for the
# scanner to catch — they are not meant to be clean themselves.
"tests/fixtures/*" = ["PLW1510", "S", "F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
